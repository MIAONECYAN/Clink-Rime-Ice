name: Publish Clink language pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version, for example v2026.09.05
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets
        run: python3 scripts/validate.py
      - name: Build manifest
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          python3 scripts/build_manifest.py "$VERSION" "${{ github.repository }}" out
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          gh release create "$VERSION" --title "$VERSION" --generate-notes out/manifest.json out/assets/*
